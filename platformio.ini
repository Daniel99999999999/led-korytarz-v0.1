[platformio]
default_envs = esp32doit-devkit-v1

[env:esp32doit-devkit-v1]
platform = espressif32 @ 7.0.1
board = esp32doit-devkit-v1
framework = espidf
board_build.partitions = partitions_ota_4mb.csv

upload_protocol = esptool
upload_port = COM4
monitor_port = COM4
monitor_speed = 115200
; ESP Console REPL na UART oczekuje pojedynczego CR. Domyslne CRLF monitora
; PlatformIO zostawia dodatkowe LF, ktore wyglada jak drugi Enter.
monitor_eol = CR
; Monitor PlatformIO ma pozostawic linie auto-programowania nieaktywne.
; Zewnetrzny terminal nadal moze przy otwarciu lub zamknieciu przelaczyc DTR/RTS i zresetowac plytke.
monitor_dtr = 0
monitor_rts = 0
build_type = debug

; Flagi dotycza tylko kodu projektu. ESP-IDF uzywa rozszerzen GNU,
; dlatego -Wpedantic nie jest zgodne z jego publicznymi naglowkami.
build_src_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wshadow
    -Wconversion
    -fno-exceptions
    -fno-rtti

monitor_filters =
    esp32_exception_decoder
    time

[env:esp32doit-devkit-v1-ota]
extends = env:esp32doit-devkit-v1
upload_protocol = custom
custom_sdkconfig_source = sdkconfig.esp32doit-devkit-v1
extra_scripts = pre:scripts/use_primary_sdkconfig.py
upload_command = "$PYTHONEXE" "$PROJECT_DIR/scripts/ota_upload.py" "$SOURCE"
