name: Publish OTA firmware

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: firmware-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout tagged sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.2.0

      - name: Verify tag and project version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_artifact.py "$RELEASE_TAG"

      - name: Run project checks
        run: bash ./scripts/check.sh

      - name: Build full OTA profile
        run: pio run -e esp32doit-devkit-v1-ota

      - name: Validate image and prepare assets
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python scripts/release_artifact.py "$RELEASE_TAG" \
            --image .pio/build/esp32doit-devkit-v1-ota/firmware.bin \
            --commit "$(git rev-parse HEAD)" \
            --output-dir .pio/release

      - name: Verify packaged checksum
        working-directory: .pio/release
        run: sha256sum -c SHA256SUMS

      - name: Publish to public firmware repository
        env:
          GH_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          public_manifest="https://github.com/Daniel99999999999/led-korytarz-firmware/releases/download/${RELEASE_TAG}/release.json"
          if curl -fsSL "$public_manifest" -o .pio/release/public-release.json 2>/dev/null; then
            echo "Release already published; verifying source commit and image"
            PYTHONPATH=scripts python - <<'PY'
          import os
          from publish_ota import RELEASE_REPO, verify_published_release
          verify_published_release(
              os.environ["RELEASE_TAG"], os.environ["SOURCE_COMMIT"],
              {"artifact_source": "release", "firmware_repo": RELEASE_REPO},
          )
          PY
            exit 0
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "Release missing and RELEASE_REPO_TOKEN not configured" >&2
            echo "Run scripts/publish_ota.py locally with GitHub login" >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" \
            .pio/release/firmware.bin \
            .pio/release/release.json \
            .pio/release/SHA256SUMS \
            --repo Daniel99999999999/led-korytarz-firmware \
            --latest \
            --title "$RELEASE_TAG" \
            --notes-file .pio/release/RELEASE_NOTES.md
